[project]
name = "din"
version = "0.1.0"
description = "personal finance management thing"
readme = "README.md"
authors = [
    { name = "Hugo Belém", email = "belem.hugo@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.51",
    "typer>=0.26.7",
]

[project.scripts]
din = "din.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = 'din'
module-root = ''
